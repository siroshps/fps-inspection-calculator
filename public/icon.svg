<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect with Safe Margins -->
  <rect width="512" height="512" rx="108" fill="url(#blueGrad)" />
  
  <!-- Scale / Balance Icon in Center (Reduced & Proportionately Balanced) -->
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" transform="translate(256, 210) scale(0.62) translate(-200, -185)">
    <!-- Base Beam -->
    <path d="M 200 40 L 200 340" />
    <path d="M 120 340 L 280 340" />
    <circle cx="200" cy="40" r="16" fill="#fbbf24" stroke="#ffffff" stroke-width="10" />
    
    <!-- Horizontal Beam -->
    <path d="M 60 100 L 340 100" stroke="#f8fafc" stroke-width="26" />
    
    <!-- Left Pan -->
    <path d="M 60 100 L 20 220" />
    <path d="M 60 100 L 100 220" />
    <path d="M 10 220 C 10 270, 110 270, 110 220 Z" fill="#38bdf8" fill-opacity="0.4" stroke-width="18" />

    <!-- Right Pan -->
    <path d="M 340 100 L 300 220" />
    <path d="M 340 100 L 380 220" />
    <path d="M 290 220 C 290 270, 390 270, 390 220 Z" fill="#34d399" fill-opacity="0.4" stroke-width="18" />
  </g>
  
  <!-- Compact Kerala PDS Badge Text with Safe Padding -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="3">FPS AUDIT</text>
</svg>
